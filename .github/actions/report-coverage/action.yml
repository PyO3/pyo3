name: 'Report coverage'
description: 'Generate coverage report using cargo-llvm-cov and upload it to Codecov'
inputs:
  name:
    description: 'The name of the coverage report'
    required: true
  token:
    description: 'Codecov upload token'
    required: true
runs:
  using: "composite"
  steps:
  - name: Generate coverage report
    shell: bash
    run: uv run --isolated --only-group nox nox -s generate-coverage-report -- --codecov --output-path=coverage.json

  - name: Upload coverage report
    uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
    with:
      files: coverage.json
      name: ${{ inputs.name }}
      token: ${{ inputs.token }}
