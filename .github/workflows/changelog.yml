name: changelog

on:
  pull_request:
    types: [opened, synchronize, labeled, unlabeled, edited]

env:
  UV_LOCKED: 1

permissions:
  contents: read

jobs:
  check:
    name: Check changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - uses: astral-sh/setup-uv@v10.4.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
      - run: uv run --isolated --only-group nox nox -s check-changelog
