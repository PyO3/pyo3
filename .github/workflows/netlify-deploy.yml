# This runs as a separate job because it needs to run on the `workflow_run` event
# in order to access the netlify secrets.
#
# This is safe because this doesn't run arbitrary code from PRs.

name: netlify-deploy

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] -- Deploys prebuilt files without executing code from the artifact.
    workflows: ["netlify-build"]
    types:
      - completed

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: read

jobs:
  deploy:
    permissions:
      actions: read # Required to download the triggering workflow's artifact.
      statuses: write # Required to post the preview deployment status.
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    environment: netlify

    steps:
      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: site
          path: site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install netlify-cli
        run: | # zizmor: ignore[adhoc-packages] -- The deployment runner has no project checkout; install the standalone CLI.
          npm install -g netlify-cli

      - name: Deploy to Netlify
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          netlify deploy --no-build --dir site \
              ${{ ((github.event.workflow_run.head_repository.full_name == 'PyO3/pyo3') && (github.event.workflow_run.head_branch == 'main') && '--prod') || '' }} \
              --json | tee deploy_output.json

      # credit: https://www.raulmelo.me/en/blog/deploying-netlify-github-actions-guide
      - name: Generate URL Preview
        id: url_preview
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        run: |
          NETLIFY_PREVIEW_URL=$(jq -r '.deploy_url' deploy_output.json)
          echo "NETLIFY_PREVIEW_URL=$NETLIFY_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post Netlify Preview Status to PR
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        env:
          NETLIFY_PREVIEW_URL: ${{ steps.url_preview.outputs.NETLIFY_PREVIEW_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.NETLIFY_PREVIEW_URL;
            const commitSha = context.payload.workflow_run.head_sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: commitSha,
              state: 'success',
              target_url: previewUrl,
              description: 'click to view Netlify preview deploy',
              context: 'netlify-deploy / preview'
            });
