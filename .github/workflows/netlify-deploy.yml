# This runs as a separate job because it needs to run on the `workflow_run` event
# in order to access the netlify secrets.
#
# This is safe because this doesn't run arbitrary code from PRs.
# Keep PR artifacts outside the working directory so the CLI cannot discover
# their configuration, plugins, or functions. Deploy the prebuilt files only.

name: netlify-deploy

on:
  workflow_run:
    workflows: ["netlify-build"]
    types:
      - completed

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event.workflow_run.conclusion == 'success'
    environment: netlify

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # workflow_run's SHA is on the default branch, not the triggering PR.
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Build Artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: site
          path: ${{ runner.temp }}/netlify-site
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Install netlify-cli
        run: npm ci --prefix .github/tools/netlify --ignore-scripts --no-audit --no-fund

      - name: Deploy to Netlify
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
        run: |
          .github/tools/netlify/node_modules/.bin/netlify deploy --no-build \
              --dir "$RUNNER_TEMP/netlify-site" \
              --site "$NETLIFY_SITE_ID" \
              ${{ ((github.event.workflow_run.event == 'push') && (github.event.workflow_run.head_repository.full_name == 'PyO3/pyo3') && (github.event.workflow_run.head_branch == 'main') && '--prod') || '' }} \
              --json > deploy_output.json

      # credit: https://www.raulmelo.me/en/blog/deploying-netlify-github-actions-guide
      - name: Generate URL Preview
        id: url_preview
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        run: |
          NETLIFY_PREVIEW_URL=$(jq -er '.deploy_url' deploy_output.json)
          echo "NETLIFY_PREVIEW_URL=$NETLIFY_PREVIEW_URL" >> "$GITHUB_OUTPUT"

      - name: Post Netlify Preview Status to PR
        if: ${{ github.event.workflow_run.event == 'pull_request' }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          NETLIFY_PREVIEW_URL: ${{ steps.url_preview.outputs.NETLIFY_PREVIEW_URL }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const previewUrl = process.env.NETLIFY_PREVIEW_URL;
            const commitSha = context.payload.workflow_run.head_sha;

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: commitSha,
              state: 'success',
              target_url: previewUrl,
              description: 'click to view Netlify preview deploy',
              context: 'netlify-deploy / preview'
            });
