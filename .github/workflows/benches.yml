name: benches

on:
  push:
    branches:
      - "main"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref_name }}-${{ github.event.pull_request.number || github.sha }}-benches
  cancel-in-progress: true

env:
  UV_LOCKED: 1
  CARGO_TERM_COLOR: always
  UV_PYTHON: "3.14t"

permissions:
  contents: read

jobs:
  benchmarks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          save-cache: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}

      # Using this action is still necessary for CodSpeed to build flamegraphs correctly,
      # see note about setup-python in https://codspeed.io/docs/benchmarks/python#recipes
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.UV_PYTHON }}

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update --component rust-src
          rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            .
            pyo3-benches
          save-if: ${{ github.ref == 'refs/heads/main' || contains(github.event.pull_request.labels.*.name, 'CI-save-pr-cache') }}
          cache-all-crates: "true"
          cache-workspace-crates: "true"

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-codspeed

      - name: Run the benchmarks
        uses: CodSpeedHQ/action@821a40cd6c80e3cfe387caf55668287addd808da # v5.5.0
        with:
          run: uv run --isolated --only-group nox nox -s codspeed
          token: ${{ secrets.CODSPEED_TOKEN }}
          mode: simulation
